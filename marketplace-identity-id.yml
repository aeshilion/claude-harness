# Temporary: prints the Azure DevOps profile id of sc-vscode-marketplace's managed identity
# for adding it as a member of the integrations-at Marketplace publisher. Remove after use.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Get Marketplace identity id
    inputs:
      azureSubscription: sc-vscode-marketplace
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query "{id:id, displayName:displayName}" -o json
